[package]
name = "ramflux-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "ramflux-desktop"
path = "src/main.rs"

[features]
# The demo scenarios (`--source mock`, the default source of debug builds)
# and the developer panel. `scripts/package-macos.sh` builds with
# `--no-default-features`, so a packaged app carries no mock data.
default = ["demo"]
demo = ["ramflux-desktop-ui/demo"]
bus-trace = ["ramflux-desktop-sdk/bus-trace"]

[dependencies]
gpui-kit.workspace = true
ramflux-desktop-sdk.workspace = true
ramflux-desktop-ui.workspace = true
