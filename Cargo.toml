[workspace]
resolver = "3"
members = [
    "apps/ramflux-desktop",
    "crates/ramflux-desktop-core",
    "crates/ramflux-desktop-media",
    "crates/ramflux-desktop-sdk",
    "crates/ramflux-desktop-test",
    "crates/ramflux-desktop-ui",
]
default-members = ["apps/ramflux-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/ramfluxhq/ramflux-desktop"

[workspace.dependencies]
# Pinned exactly: GPUI Kit ships breaking minor releases every few weeks.
gpui-kit = "=0.8.1"
ron = "0.12"
rust-i18n = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Grapheme clusters and terminal-cell widths, to clip a label by what it shows.
unicode-segmentation = "1.13"
# NFKD, to read a typed recovery word the way the backend does.
unicode-normalization = "0.1.25"
unicode-width = "0.2"
zeroize = "1.8"
# The product SDK (local-bus client, request types), pinned by full commit.
ramflux-sdk = { git = "https://github.com/ramfluxhq/ramflux.git", rev = "18a97d1ee46a3fd2d6c39bc8ef6b82d07103f5da" }
ramflux-protocol = { git = "https://github.com/ramfluxhq/ramflux.git", rev = "18a97d1ee46a3fd2d6c39bc8ef6b82d07103f5da" }
ramflux-crypto = { git = "https://github.com/ramfluxhq/ramflux.git", rev = "18a97d1ee46a3fd2d6c39bc8ef6b82d07103f5da" }
# Only on the SDK bridge thread; never in GPUI tasks or core.
tokio = { version = "1.42", default-features = false, features = ["rt", "net", "sync", "time", "macros", "io-util"] }
ramflux-desktop-core = { path = "crates/ramflux-desktop-core" }
ramflux-desktop-media = { path = "crates/ramflux-desktop-media" }
ramflux-desktop-sdk = { path = "crates/ramflux-desktop-sdk" }
ramflux-desktop-test = { path = "crates/ramflux-desktop-test" }
ramflux-desktop-ui = { path = "crates/ramflux-desktop-ui" }
