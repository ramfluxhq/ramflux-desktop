[workspace]
resolver = "3"
members = [
    "apps/ramflux-desktop",
    "crates/ramflux-desktop-core",
    "crates/ramflux-desktop-design",
    "crates/ramflux-desktop-navigation",
    "crates/ramflux-desktop-media",
    "crates/ramflux-desktop-sdk",
    "crates/ramflux-desktop-test",
    "crates/ramflux-desktop-ui",
]
default-members = ["apps/ramflux-desktop"]

[workspace.package]
version = "0.2.6"
edition = "2024"
rust-version = "1.99.0"
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/ramfluxhq/ramflux-desktop"

# Conventions enforced in every crate (each crate opts in with
# `[lints] workspace = true`; `crates/ramflux-desktop-test/tests/conventions.rs`
# checks that every member does). Production code must not unwrap, expect,
# panic or take `std::sync` locks (listed in `clippy.toml`): each crate root
# denies those with
# `#![cfg_attr(not(test), deny(clippy::disallowed_types, clippy::expect_used, clippy::panic, clippy::unwrap_used))]`,
# which leaves unit and integration tests free to.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
disallowed_types = "allow"

[workspace.dependencies]
# Pinned exactly: GPUI Kit ships breaking minor releases every few weeks.
gpui-kit = "=0.8.0"
# Locks that do not poison (the workspace rule: no `std::sync` locks).
parking_lot = "0.12"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The operating system's preferred language, for "follow system".
sys-locale = "0.3"
thiserror = "2"
# Grapheme clusters and terminal-cell widths, to clip a label by what it shows.
unicode-segmentation = "1.13"
# NFKD, to read a typed recovery word the way the backend does.
unicode-normalization = "0.1.25"
unicode-width = "0.2"
zeroize = "1.8"
# The product SDK (local-bus client, request types), pinned by full commit.
ramflux-sdk = { git = "https://github.com/ramfluxhq/ramflux.git", rev = "01174ecef0567b60c76dd56b176c5e7c39bd3d07" }
ramflux-protocol = { git = "https://github.com/ramfluxhq/ramflux.git", rev = "01174ecef0567b60c76dd56b176c5e7c39bd3d07" }
ramflux-crypto = { git = "https://github.com/ramfluxhq/ramflux.git", rev = "01174ecef0567b60c76dd56b176c5e7c39bd3d07" }
# PRX agent names derived from anchors (the same rev as the product SDK).
ramflux-prx-client = { git = "https://github.com/ramfluxhq/ramflux.git", rev = "01174ecef0567b60c76dd56b176c5e7c39bd3d07" }
# The standalone card runtime: only the test-build card gallery (feature `card-gallery`).
ramflux-card = { git = "https://github.com/ramfluxhq/ramflux.git", rev = "01174ecef0567b60c76dd56b176c5e7c39bd3d07" }
# Only on the SDK bridge thread; never in GPUI tasks or core.
tokio = { version = "1.42", default-features = false, features = ["rt", "net", "sync", "time", "macros", "io-util"] }
ramflux-desktop-core = { path = "crates/ramflux-desktop-core" }
ramflux-desktop-navigation = { path = "crates/ramflux-desktop-navigation" }
ramflux-desktop-media = { path = "crates/ramflux-desktop-media" }
ramflux-desktop-sdk = { path = "crates/ramflux-desktop-sdk" }
ramflux-desktop-test = { path = "crates/ramflux-desktop-test" }
# Without its default `demo` feature: the app crate decides (feature `demo`).
ramflux-desktop-ui = { path = "crates/ramflux-desktop-ui", default-features = false }
