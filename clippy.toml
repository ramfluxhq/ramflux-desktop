msrv = "1.99.0"
avoid-breaking-exported-api = true
too-many-arguments-threshold = 6
type-complexity-threshold = 250
# `dbg!` is denied workspace-wide (`Cargo.toml`), except inside tests.
allow-dbg-in-tests = true
# The workspace rule: locks come from `parking_lot` or `tokio::sync`.
disallowed-types = [
    { path = "std::sync::Mutex", reason = "use parking_lot::Mutex or tokio::sync::Mutex" },
    { path = "std::sync::RwLock", reason = "use parking_lot::RwLock or tokio::sync::RwLock" },
    { path = "std::sync::Condvar", reason = "use parking_lot::Condvar or a tokio::sync primitive" },
]
