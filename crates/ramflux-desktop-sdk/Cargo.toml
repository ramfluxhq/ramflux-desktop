[package]
name = "ramflux-desktop-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Bounded send metadata; disabled in ordinary builds.
bus-trace = []
# Completion ordering and deterministic bridge time for integration tests.
test-support = ["tokio/test-util"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
parking_lot.workspace = true
ramflux-crypto.workspace = true
unicode-general-category.workspace = true
# The current process user id, through a safe wrapper (no `unsafe` here).
rustix = { version = "1", default-features = false, features = ["process"] }
ramflux-prx-client.workspace = true
ramflux-protocol.workspace = true
ramflux-desktop-core.workspace = true
ramflux-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
ramflux-desktop-test = { workspace = true, features = ["fake-bus", "live-daemon", "v1-fixtures"] }
# Enables the gate's own test-support items for `-p ramflux-desktop-sdk` runs.
ramflux-desktop-sdk = { path = ".", features = ["test-support"] }

# Its own binary is the stand-in daemon it starts (see the file), so it has
# its own `main` instead of the libtest harness.
[[test]]
name = "daemon_process"
path = "tests/daemon_process.rs"
harness = false
