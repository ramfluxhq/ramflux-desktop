[package]
name = "ramflux-desktop-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
ramflux-crypto.workspace = true
ramflux-protocol.workspace = true
ramflux-desktop-core.workspace = true
ramflux-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
ramflux-desktop-test = { workspace = true, features = ["fake-bus", "live-daemon"] }

# Its own binary is the stand-in daemon it starts (see the file), so it has
# its own `main` instead of the libtest harness.
[[test]]
name = "daemon_process"
path = "tests/daemon_process.rs"
harness = false
