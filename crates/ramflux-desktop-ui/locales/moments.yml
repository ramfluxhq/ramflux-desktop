      en: "invited"
      zh-CN: "已邀请"
    joined:
      en: "joined"
      zh-CN: "已加入"
    left:
      en: "left"
      zh-CN: "已离开"
    removed:
      en: "removed"
      zh-CN: "已被移出"
    banned:
      en: "banned"
      zh-CN: "已被封禁"
    role_changed:
      en: "role changed"
      zh-CN: "角色已变更"
