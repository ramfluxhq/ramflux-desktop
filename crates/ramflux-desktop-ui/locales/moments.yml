    count:
      en: "%{done} of %{total} steps"
      zh-CN: "第 %{done}/%{total} 步"
    proposal_hint:
      en: "%{name} proposes this plan and starts only when you do."
      zh-CN: "%{name} 提议了这个计划，你开始后才会执行。"
    start:
      en: "Start task"
      zh-CN: "开始任务"
    decline:
      en: "Decline"
      zh-CN: "拒绝"
    not_yours:
      en: "Waiting for the person who asked"
      zh-CN: "等待发起人确认"
    show_result:
      en: "Show result"
      zh-CN: "查看结果"
    place_missing:
      en: "Waiting for the request to arrive"
      zh-CN: "正在等待请求到达"
    choose_in_view:
      en: "Choose in %{name}'s view"
      zh-CN: "请在 %{name} 的界面中选择"
    answer_in_view:
      en: "Answer in %{name}'s view"
      zh-CN: "请在 %{name} 的界面中填写"
    show_view:
      en: "Show"
      zh-CN: "查看"
    show_steps:
      en: "Show all steps"
      zh-CN: "显示全部步骤"
    hide_steps:
      en: "Hide steps"
      zh-CN: "收起步骤"
    cancel:
      en: "Cancel task"
      zh-CN: "取消任务"
    missing:
      en: "Task details are not available yet"
      zh-CN: "任务详情暂不可用"
    kind_unverified:
      en: "AI participant (not verified)"
      zh-CN: "AI 参与者（未验证）"
    asked_by:
      en: "Asked by %{name}, who decides and can cancel it"
      zh-CN: "由 %{name} 发起，由其决定或取消"
    decided_by:
      en: "Waiting for %{name} to decide"
      zh-CN: "等待 %{name} 决定"
    compacted:
      en: "Older history was compacted; the outcome is kept"
      zh-CN: "较早的记录已压缩，结果仍保留"
    stalled:
      title:
        en: "Stalled by %{name}"
        zh-CN: "%{name} 已停滞"
      text:
        en: "%{name} can't send more updates to this task for now."
        zh-CN: "%{name} 暂时无法再更新此任务。"
      text_mine:
        en: "%{name} can't send more updates to this task for now. You can still cancel it."
        zh-CN: "%{name} 暂时无法再更新此任务。你仍可以取消它。"
    answer:
      pending:
        en: "Decision sent. Waiting for %{name} to confirm it."
        zh-CN: "决定已发送，正在等待 %{name} 确认。"
    refused:
      title:
        en: "Nothing was done"
        zh-CN: "未执行任何操作"
      changed:
        title:
          en: "Changed since you looked"
          zh-CN: "你查看后任务已变更"
        text:
          en: "Nothing was done. Review the task again, then decide."
          zh-CN: "未执行任何操作。请重新查看任务后再决定。"
      finished:
        en: "This task has already finished."
        zh-CN: "此任务已经结束。"
      not_allowed:
        en: "Only the person who asked for this task can do that."
        zh-CN: "只有发起此任务的人可以这样做。"
      already_decided:
        en: "That decision was already used."
        zh-CN: "该决定已被使用过。"
      too_large:
        en: "The request is too large to send as a task message."
        zh-CN: "请求过大，无法作为任务消息发送。"
      stalled:
        en: "This task is stalled. You can still cancel it."
        zh-CN: "此任务已停滞。你仍可以取消它。"
      busy:
        en: "Too many task requests right now. Try again in a minute."
        zh-CN: "当前任务请求过多，请稍后再试。"
      rejected:
        title:
          en: "%{name} couldn't confirm your decision"
          zh-CN: "%{name} 无法确认你的决定"
        text:
          en: "The step still needs you."
          zh-CN: "此步骤仍需要你处理。"
      other:
        en: "The daemon refused it: %{reason}"
        zh-CN: "守护进程拒绝了该请求：%{reason}"
  conflict:
    title:
      en: "%{name} changed in two places"
      zh-CN: "%{name} 在两处被修改"
    explain:
      en: "This update does not match your local version. Compare them and choose what to keep."
      zh-CN: "此更新与本地版本不一致。请对比后选择保留哪一份。"
    local:
      en: "This device · %{version}"
      zh-CN: "本设备 · %{version}"
    remote:
      en: "Other side · %{version}"
      zh-CN: "对方 · %{version}"
    keep_local:
      en: "Keep mine"
      zh-CN: "保留我的版本"
    keep_remote:
      en: "Keep theirs"
      zh-CN: "保留对方版本"
    keep_both:
      en: "Keep both"
      zh-CN: "两份都保留"
    kept_local:
      en: "Kept your version"
      zh-CN: "已保留你的版本"
    kept_remote:
      en: "Kept their version"
      zh-CN: "已保留对方版本"
    kept_both:
      en: "Kept both versions"
      zh-CN: "两份版本都已保留"
    closed:
      en: "Closed"
      zh-CN: "已关闭"
  privacy:
    reveal:
      en: "Reveal…"
      zh-CN: "显示…"
    audited:
      en: "Revealing is recorded"
      zh-CN: "显示操作会被记录"
    audit:
      en: "Revealed by %{name} at %{time}"
      zh-CN: "%{name} 于 %{time} 显示"
  handoff:
    offer:
      en: "%{device} offers to continue here"
      zh-CN: "%{device} 请求在此继续"
    accept:
      en: "Continue here"
      zh-CN: "在此继续"
    decline:
      en: "Not now"
      zh-CN: "暂不"
    accepted:
      en: "Continued on %{device}"
      zh-CN: "已在 %{device} 上继续"
    declined:
      en: "Declined"
      zh-CN: "已拒绝"
surface:
  streaming:
    en: "Writing…"
    zh-CN: "正在生成…"
  waiting:
    en: "Writing…"
    zh-CN: "正在生成…"
  closed:
    en: "Closed"
    zh-CN: "已关闭"
  show_final:
    en: "Show final view"
    zh-CN: "查看最终界面"
  hide_final:
    en: "Hide final view"
    zh-CN: "收起最终界面"
  show_all:
    en: "Show all %{count} blocks"
    zh-CN: "显示全部 %{count} 个区块"
  show_less:
    en: "Show less"
    zh-CN: "收起"
  fallback:
    en: "Shown as text: this part cannot be displayed here"
    zh-CN: "以文本显示：此部分无法在此显示"
  action_hold:
    en: "%{label}…"
    zh-CN: "%{label}…"
  redacted:
    en: "Hidden: this part cannot be shown on this device"
    zh-CN: "已隐藏：此部分不能在本设备上显示"
  over_limit:
    title:
      en: "Shown as a summary"
      zh-CN: "以摘要显示"
    text:
      en: "This surface is larger than this client shows (%{limit}), so only its summary is shown and it offers no actions."
      zh-CN: "此界面超出本客户端的显示上限（%{limit}），因此仅显示摘要，且不提供任何操作。"
  limit:
    blocks:
      en: "too many blocks"
      zh-CN: "区块过多"
    actions:
      en: "too many actions"
      zh-CN: "操作过多"
    text:
      en: "text too long"
      zh-CN: "文本过长"
    data:
      en: "too much data"
      zh-CN: "数据过大"
    delta:
      en: "an update too large"
      zh-CN: "单次更新过大"
    stream:
      en: "streamed text too long"
      zh-CN: "流式文本过长"
  conflict:
    title:
      en: "Out of date"
      zh-CN: "内容已过期"
    text:
      en: "An update was made against an older version of this surface. Waiting for the agent to send it again."
      zh-CN: "有更新基于此界面的旧版本。正在等待智能体重新发送。"
    action:
      en: "Unavailable until the surface is up to date"
      zh-CN: "界面更新前不可用"
  updated:
    en: "updated %{time}"
    zh-CN: "更新于 %{time}"
  out_of_sync:
    title:
      en: "Not up to date"
      zh-CN: "未同步到最新"
    text:
      en: "This device missed an update from the author, so what you see may be an older version. Actions are paused until it catches up."
      zh-CN: "本设备错过了作者的一次更新，你看到的可能是旧版本。在同步到最新之前，操作暂停。"
    request:
      en: "Request update"
      zh-CN: "请求更新"
    requested:
      en: "Update requested. The author's current version replaces this view when it arrives."
      zh-CN: "已请求更新。作者的当前版本到达后将替换此界面。"
    refused:
      en: "Couldn't request an update: %{reason}"
      zh-CN: "无法请求更新：%{reason}"
  review_again:
    title:
      en: "Changed after you reviewed it"
      zh-CN: "你审阅后内容已变更"
    text:
      en: "Nothing was done. Review the changes, then choose again."
      zh-CN: "未执行任何操作。请审阅变更后重新选择。"
