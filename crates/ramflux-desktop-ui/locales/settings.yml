          en: "%{count} available file matches its checksum."
          zh-CN: "全部 %{count} 个可用文件均与校验值一致。"
        other:
          en: "All %{count} available files match their checksums."
          zh-CN: "全部 %{count} 个可用文件均与校验值一致。"
      files_problem:
