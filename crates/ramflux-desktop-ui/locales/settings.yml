          en: "%{count} file matches its checksum."
          zh-CN: "全部 %{count} 个文件均与校验值一致。"
        other:
          en: "All %{count} files match their checksums."
          zh-CN: "全部 %{count} 个文件均与校验值一致。"
      files_verified_available:
