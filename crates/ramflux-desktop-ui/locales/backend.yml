_version: 2
backend:
  gap:
    surfaces:
      en: "Agent surfaces are not available in conversations yet."
      zh-CN: "会话中暂不支持智能体卡片。"
    handoff:
      en: "Handoff is not available from the daemon yet."
      zh-CN: "守护进程尚不支持接力。"
    conflicts:
      en: "Resolving conflicts is not available from the daemon yet."
      zh-CN: "守护进程尚不支持解决冲突。"
    reveal:
      en: "Revealing hidden content is not available from the daemon yet."
      zh-CN: "守护进程尚不支持显示隐藏内容。"
    calls:
      en: "Voice calls are not available from the daemon yet."
      zh-CN: "守护进程尚不支持语音通话。"
    contact_requests:
      en: "Contact requests are not available from the daemon yet."
      zh-CN: "守护进程尚不支持联系人请求。"
    full_backup:
      en: "Full backup and restore need a newer daemon."
      zh-CN: "完整备份与恢复需要更新版本的守护进程。"
    contact_route:
      en: "A contact request travels to the contact's node and needs a federation route to it, which the daemon does not list."
      zh-CN: "联系人请求需发送到对方节点，需要通往该节点的联邦路由，守护进程未提供。"
    spaces:
      en: "The daemon has no shared spaces."
      zh-CN: "守护进程不支持共享空间。"
    group_attachments:
      en: "Group messages cannot carry attachments yet."
      zh-CN: "群消息暂不支持附件。"
    no_route:
      en: "This conversation has no active route to the contact's device. A route is recorded when a message is exchanged with a verified device."
      zh-CN: "此会话没有通往对方设备的有效路由。与已验证设备收发消息后才会记录路由。"
    no_group_link:
      en: "This conversation is not linked to a group."
      zh-CN: "此会话未关联群组。"
    no_member_route:
      en: "No verified device is listed for this person, so they cannot be added or invited. Verify the contact first."
      zh-CN: "未列出此人的已验证设备，无法添加或邀请。请先验证该联系人。"
    no_member_device:
      en: "This person has no device in the group."
      zh-CN: "此人在群组中没有设备。"
    no_commitment:
      en: "The contact's identity commitment is not listed yet."
      zh-CN: "尚未列出该联系人的身份承诺。"
    no_relay:
      en: "The relay of this account's node is not known."
      zh-CN: "未知此账户所在节点的中继。"
    no_self:
      en: "This account's own identity is not known yet."
      zh-CN: "尚未获知此账户自身的身份。"
    no_direction:
      en: "It is not known whether this object was sent or received."
      zh-CN: "无法确定此文件是发送还是接收的。"
    activation:
      en: "Joining by activation code is not available from the daemon yet."
      zh-CN: "守护进程尚不支持通过激活码加入。"
    device_sync:
      en: "Device sync needs a relay route and a target device the desktop cannot choose yet."
      zh-CN: "设备同步需要中继路由和目标设备，桌面端暂不能选择。"
  surface:
    refused:
      en: "the daemon refused it (%{code})."
      zh-CN: "守护进程拒绝了此请求（%{code}）。"
    stale_version:
      en: "the surface changed after you saw it."
      zh-CN: "界面在你查看后已更改。"
    stale_hash:
      en: "the surface's content changed after you saw it."
      zh-CN: "界面内容在你查看后已更改。"
    not_author:
      en: "only the surface's author can do that."
      zh-CN: "只有界面作者可以执行此操作。"
    not_out_of_sync:
      en: "this surface is already up to date."
      zh-CN: "此界面已是最新。"
    rate_limited:
      en: "an update was requested less than a minute ago. Try again shortly."
      zh-CN: "不到一分钟前已请求过更新，请稍后再试。"
    too_large:
      en: "the surface is too large to send."
      zh-CN: "界面过大，无法发送。"
    not_found:
      en: "the daemon no longer has this surface."
      zh-CN: "守护进程中已没有此界面。"
    out_of_sync:
      en: "this surface is not up to date. Request an update first."
      zh-CN: "此界面未同步到最新，请先请求更新。"
    not_action_executor:
      en: "another of your devices takes this surface's actions."
      zh-CN: "此界面的操作由你的另一台设备处理。"
    already_used:
      en: "this action was already used."
      zh-CN: "此操作已使用过。"
    closed:
      en: "the surface is closed."
      zh-CN: "界面已关闭。"
    not_permitted:
      en: "that is not permitted on this surface."
      zh-CN: "此界面不允许该操作。"
    invalid_request:
      en: "the daemon could not accept the request."
      zh-CN: "守护进程无法接受此请求。"
  call:
    media:
      en: "Couldn't set up the call's audio connection."
      zh-CN: "无法建立通话的音频连接。"
  message:
    encrypted_at_rest:
      en: "This message is stored encrypted; its text is shown only when it is received or sent here."
      zh-CN: "此消息以密文存储，仅在本机收发时显示正文。"
  failure:
    surface_action_rejected:
      en: "The daemon did not send the action: %{reason}"
      zh-CN: "守护进程未发送此操作：%{reason}"
    label:
      en: "Last error"
      zh-CN: "上次错误"
    timeout:
      en: "The daemon did not answer in time."
      zh-CN: "守护进程未在规定时间内响应。"
    unauthenticated:
      en: "The node refused this device's session as not signed in. Nothing was sent, and it will not be retried until you sign in again."
      zh-CN: "节点认为本设备的会话未登录并拒绝了它。未发送任何内容，在你重新登录前不会重试。"
    transport_security:
      en: "The node's certificate did not match the one this device trusts. Nothing was sent, and it will not be retried until the node's trust is repaired."
      zh-CN: "节点证书与本设备信任的证书不符。未发送任何内容，在修复节点信任前不会重试。"
    reconcile:
      en: "The daemon cannot tell whether this was applied after an interrupted attempt. Check the result before trying again."
      zh-CN: "上次尝试中断，守护进程无法确定此操作是否已生效。请先核对结果再重试。"
    value:
      en: "%{action}: %{reason}"
      zh-CN: "%{action}：%{reason}"
    attachment_too_large:
      en: "The file is larger than %{limit} bytes, the most one message can carry."
      zh-CN: "文件超过 %{limit} 字节，超出单条消息可携带的上限。"
    file:
      en: "The file could not be read or written: %{reason}"
      zh-CN: "无法读取或写入文件：%{reason}"
    group_routes_unresolved:
      en: "Not sent to anyone: no route to %{members}. Nothing was delivered."
      zh-CN: "未发送给任何人：无法路由到 %{members}。没有任何投递。"
    local_network:
      en: "The node cannot be reached because Ramflux Desktop may not use the local network. Allow it in System Settings › Privacy & Security › Local Network, then try again."
      zh-CN: "无法连接节点：Ramflux Desktop 尚未获准访问本地网络。请在“系统设置 › 隐私与安全性 › 本地网络”中允许后重试。"
    local_network_maybe:
      en: "The node at %{host} on your local network did not answer. If macOS has not allowed Ramflux Desktop to use the local network, allow it in System Settings › Privacy & Security › Local Network, then try again."
      zh-CN: "本地网络上的节点 %{host} 没有响应。如果 macOS 尚未允许 Ramflux Desktop 访问本地网络，请在“系统设置 › 隐私与安全性 › 本地网络”中允许后重试。"
    partial:
      en: "Stopped after %{done} of %{total}: %{reason}"
      zh-CN: "完成 %{done}/%{total} 后停止：%{reason}"
    start_no_identity:
      en: "This account does not list %{name}'s devices yet, so the first message has no route. Add %{name} from their contact card, or try again once their node lists them."
      zh-CN: "此账户尚未列出 %{name} 的设备，第一条消息没有路由。请通过 %{name} 的联系人名片添加，或在其节点列出后重试。"
    start_no_target:
      en: "None of %{name}'s devices has a delivery address yet, so the first message cannot be addressed. Ask %{name} to open Ramflux once so their device registers, then try again."
      zh-CN: "%{name} 的设备都还没有投递地址，第一条消息无法寻址。请 %{name} 打开一次 Ramflux 以注册设备，然后重试。"
    group_member_route:
      en: "No verified device is listed for %{name}, so the group was not created. Add %{name} from their contact card first."
      zh-CN: "未列出 %{name} 的已验证设备，群组未创建。请先通过 %{name} 的联系人名片添加。"
    start_unverified_key:
      en: "%{name}'s device keys are not verified for this account yet. Open Contacts and verify %{name}'s safety number, then try again."
      zh-CN: "%{name} 的设备密钥尚未在此账户中验证。请打开联系人，验证 %{name} 的安全码后重试。"
  contact:
    unknown_principal:
      en: "No one is registered under this id on your home node. Check the id, or ask for their contact card."
      zh-CN: "你的主节点上没有以此 ID 注册的人。请核对 ID，或向对方索取联系人名片。"
    invalid_card:
      en: "This is not a contact card this account can use. Cards work only for people on your own home node."
      zh-CN: "这不是此账户可用的联系人名片。名片仅适用于与你同一主节点上的人。"
    card_signature_invalid:
      en: "The card's signature does not match the identity it names. Do not use it; ask for a new card in person."
      zh-CN: "名片的签名与其所述身份不符。请勿使用，并当面索取新名片。"
    card_expired:
      en: "This contact card has expired. Ask for a fresh one."
      zh-CN: "此联系人名片已过期。请索取新名片。"
    self_contact:
      en: "That is this account itself."
      zh-CN: "这是此账户自己。"
    already_contact:
      en: "Already a contact."
      zh-CN: "已经是联系人。"
    request_cooldown:
      en: "%{name} declined your request recently. You can ask again a day after they declined."
      zh-CN: "%{name} 最近拒绝了你的请求。对方拒绝一天后，你可以再次发送。"
    request_closed:
      en: "This request was already answered or has expired."
      zh-CN: "此请求已处理或已过期。"
    request_not_found:
      en: "This request is no longer available."
      zh-CN: "此请求已不存在。"
    invalid_request_note:
      en: "The note can be one line of up to 140 characters."
      zh-CN: "附言须为一行，最多 140 个字符。"
    request_unavailable:
      en: "Contact requests can't be handled right now. Nothing changed; try again later."
      zh-CN: "暂时无法处理联系人请求。未做任何更改，请稍后再试。"
    requests_unreadable:
      en: "Contact requests couldn't be read just now; trying again. (%{reason})"
      zh-CN: "暂时无法读取联系人请求，正在重试。（%{reason}）"
    root_conflict:
      en: "The contact's identity changed while you were confirming it. Nothing was replaced; review it again."
      zh-CN: "确认期间对方身份发生了变化。未做任何替换，请重新核对。"
    manifest_invalid:
      en: "The contact's published identity could not be verified. Nothing was added."
      zh-CN: "无法验证对方发布的身份。未添加任何内容。"
    principal_id_ambiguous:
      en: "Several identities hold this id on the node, so it cannot be added by id. Ask for their contact card."
      zh-CN: "节点上有多个身份使用此 ID，无法按 ID 添加。请索取对方的联系人名片。"
    rate_limited:
      en: "Too many lookups in the last minute. Try again in a minute."
      zh-CN: "过去一分钟内查询过多。请一分钟后重试。"
    principal_id_taken:
      en: "This id is already registered to another identity on the node. Choose another id."
      zh-CN: "此 ID 已在节点上注册给另一个身份。请换一个 ID。"
    device_id_taken:
      en: "This device id is already registered to another identity on the node. Start again to get a new device id."
      zh-CN: "此设备 ID 已在节点上注册给另一个身份。请重新开始以获得新的设备 ID。"
    unavailable:
      en: "Your home node can't be reached or is busy right now. Nothing was added; try again later."
      zh-CN: "你的主节点暂时无法连接或繁忙。未添加任何内容，请稍后再试。"
    root_replacement:
      en: "This card names another identity for %{name} than the earlier lookup found (lookup: %{previous}; card: %{proposed}). Compare with %{name} before replacing it."
      zh-CN: "此名片为 %{name} 给出的身份与之前查询到的不同（查询：%{previous}；名片：%{proposed}）。替换前请与 %{name} 核对。"
    home_insecure_transport:
      en: "Your home node's address is plain HTTP on the network, which a contact card cannot carry. The node needs an HTTPS address."
      zh-CN: "你的主节点地址是网络上的明文 HTTP，联系人名片无法携带。该节点需要 HTTPS 地址。"
    home_profile_stale:
      en: "Your home node's profile is out of date. Refresh the node in Settings › Nodes, then try again."
      zh-CN: "你的主节点资料已过期。请在“设置 › 节点”中刷新该节点后重试。"
    export_failed:
      en: "this account's home node cannot be named on a contact card."
      zh-CN: "此账户的主节点无法写入联系人名片。"
    no_home_node:
      en: "Contact cards need this account's home node, and none is set up. Join your home node in Settings › Nodes first."
      zh-CN: "联系人名片需要此账户的主节点，但尚未设置。请先在“设置 › 节点”中加入你的主节点。"
  daemon:
    socket:
      en: "Attached to %{path} · %{accounts} open accounts"
      zh-CN: "已连接 %{path} · 已打开 %{accounts} 个账户"
  backup:
    wrong_passphrase:
      en: "This passphrase doesn't open the backup. Check it and try again."
      zh-CN: "此口令无法打开该备份。请检查后重试。"
    tampered:
      en: "The backup file was changed or damaged, so it can't be trusted."
      zh-CN: "备份文件已被修改或损坏，无法信任。"
    truncated:
      en: "The backup file is incomplete. It may not have finished copying."
      zh-CN: "备份文件不完整，可能尚未复制完成。"
    unsupported_version:
      en: "This backup was made by a newer version of Ramflux."
      zh-CN: "此备份由更新版本的 Ramflux 创建。"
    insufficient_space:
      en: "Not enough disk space: %{needed} needed, %{available} free."
      zh-CN: "磁盘空间不足：需要 %{needed}，可用 %{available}。"
    unreadable:
      en: "The backup file can't be read."
      zh-CN: "无法读取备份文件。"
    not_writable:
      en: "Can't write to the chosen location."
      zh-CN: "无法写入所选位置。"
    staging_expired:
      en: "The checked copy expired before it was restored. Check the backup again."
      zh-CN: "检查过的副本在恢复前已过期。请重新检查备份。"
    interrupted:
      en: "The daemon stopped while this was running. Nothing was changed."
      zh-CN: "运行期间守护进程已停止，未作任何更改。"
    attachment_mismatch:
      en: "Some files in the backup are missing or don't match their checksums, so nothing was restored."
      zh-CN: "备份中有文件缺失或与校验值不一致，因此未恢复任何内容。"
    attachment_mismatch_counts:
      en: "%{bad} of %{count} files in the backup are missing or don't match their checksums, so nothing was restored."
      zh-CN: "备份的 %{count} 个文件中有 %{bad} 个缺失或与校验值不一致，因此未恢复任何内容。"
    attachments_unavailable:
      en: "Some files in this account could not be fetched, so no backup was written."
      zh-CN: "此账户中有文件无法获取，因此未写入备份。"
    attachments_unavailable_count:
      en: "%{count} files in this account could not be fetched, so no backup was written."
      zh-CN: "此账户中有 %{count} 个文件无法获取，因此未写入备份。"
    identity_rollback:
      en: "This backup holds an older identity than this device trusts, so it can't be restored as a new account."
      zh-CN: "此备份中的身份比本设备信任的更旧，无法作为新账户恢复。"
    root_conflict:
      en: "This backup belongs to a different identity than the account here. It can't replace it."
      zh-CN: "此备份属于与本账户不同的身份，无法替换。"
    busy:
      en: "Another backup or restore is running. Wait until it ends."
      zh-CN: "另一个备份或恢复正在进行，请等待其结束。"
    account_locked:
      en: "The account is locked. Unlock it to back it up."
      zh-CN: "账户已锁定。请先解锁再备份。"
    unknown_job:
      en: "The daemon no longer knows this backup or restore (it may have restarted)."
      zh-CN: "守护进程已不再记录此备份或恢复（可能已重启）。"
    invalid_job_phase:
      en: "The backup or restore can't do this now."
      zh-CN: "该备份或恢复当前无法执行此操作。"
