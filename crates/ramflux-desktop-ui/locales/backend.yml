_version: 2
backend:
  gap:
    tasks:
      en: "Tasks need the daemon's task API (K3)."
      zh-CN: "任务需要守护进程的任务接口（K3）。"
    surfaces:
      en: "Agent surfaces need A2UI bound to conversations (K2)."
      zh-CN: "智能体界面需要绑定到会话的 A2UI（K2）。"
    handoff:
      en: "Handoff is not available from the daemon yet (K7)."
      zh-CN: "守护进程尚不支持接力（K7）。"
    conflicts:
      en: "Resolving conflicts needs CAS objects (K8)."
      zh-CN: "解决冲突需要 CAS 对象（K8）。"
    reveal:
      en: "Revealing needs the daemon's privacy audit (K9)."
      zh-CN: "揭示内容需要守护进程的隐私审计（K9）。"
    contact_route:
      en: "A contact request travels to the contact's node and needs a federation route to it, which the daemon does not list."
      zh-CN: "联系人请求需发送到对方节点，需要通往该节点的联邦路由，守护进程未提供。"
    spaces:
      en: "The daemon has no shared spaces."
      zh-CN: "守护进程不支持共享空间。"
    group_attachments:
      en: "Group messages cannot carry attachments yet."
      zh-CN: "群消息暂不支持附件。"
    no_route:
      en: "This conversation has no active route to the contact's device. A route is recorded when a message is exchanged with a verified device."
      zh-CN: "此会话没有通往对方设备的有效路由。与已验证设备收发消息后才会记录路由。"
    no_group_link:
      en: "This conversation is not linked to a group."
      zh-CN: "此会话未关联群组。"
    no_member_route:
      en: "No verified device is listed for this person, so they cannot be added or invited. Verify the contact first."
      zh-CN: "未列出此人的已验证设备，无法添加或邀请。请先验证该联系人。"
    no_member_device:
      en: "This person has no device in the group."
      zh-CN: "此人在群组中没有设备。"
    no_commitment:
      en: "The contact's identity commitment is not listed yet."
      zh-CN: "尚未列出该联系人的身份承诺。"
    no_relay:
      en: "The relay of this account's node is not known."
      zh-CN: "未知此账户所在节点的中继。"
    no_self:
      en: "This account's own identity is not known yet."
      zh-CN: "尚未获知此账户自身的身份。"
    no_direction:
      en: "It is not known whether this object was sent or received."
      zh-CN: "无法确定此对象是发送还是接收的。"
    activation:
      en: "Joining by activation code is not available from the daemon yet."
      zh-CN: "守护进程尚不支持通过激活码加入。"
    device_sync:
      en: "Device sync needs a relay route and a target device the desktop cannot choose yet."
      zh-CN: "设备同步需要中继路由和目标设备，桌面端暂不能选择。"
  message:
    encrypted_at_rest:
      en: "This message is stored encrypted; its text is shown only when it is received or sent here."
      zh-CN: "此消息以密文存储，仅在本机收发时显示正文。"
  failure:
    label:
      en: "Last error"
      zh-CN: "上次错误"
    timeout:
      en: "The daemon did not answer in time."
      zh-CN: "守护进程未在规定时间内响应。"
    reconcile:
      en: "The daemon cannot tell whether this was applied after an interrupted attempt. Check the result before trying again."
      zh-CN: "上次尝试中断，守护进程无法确定此操作是否已生效。请先核对结果再重试。"
    value:
      en: "%{action}: %{reason}"
      zh-CN: "%{action}：%{reason}"
    attachment_too_large:
      en: "The file is larger than %{limit} bytes, the most one message can carry."
      zh-CN: "文件超过 %{limit} 字节，超出单条消息可携带的上限。"
    file:
      en: "The file could not be read or written: %{reason}"
      zh-CN: "无法读取或写入文件：%{reason}"
    group_routes_unresolved:
      en: "Not sent to anyone: no route to %{members}. Nothing was delivered."
      zh-CN: "未发送给任何人：无法路由到 %{members}。没有任何投递。"
    partial:
      en: "Stopped after %{done} of %{total}: %{reason}"
      zh-CN: "完成 %{done}/%{total} 后停止：%{reason}"
  daemon:
    socket:
      en: "Attached to %{path} · %{accounts} open accounts"
      zh-CN: "已连接 %{path} · 已打开 %{accounts} 个账户"
