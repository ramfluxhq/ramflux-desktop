[package]
name = "ramflux-desktop-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
gpui-kit.workspace = true
ramflux-desktop-core.workspace = true
# The scenario-playing mock source drives the UI until the SDK source lands (F2).
ramflux-desktop-test.workspace = true
rust-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true
# Local wall-clock time for moment headers (already in the dependency graph).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

# Offscreen reference screenshots; run explicitly, not part of `cargo test`.
[[test]]
name = "screenshots"
path = "tests/screenshots.rs"
test = false
harness = false
