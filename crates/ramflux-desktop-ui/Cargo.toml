[package]
name = "ramflux-desktop-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
gpui-kit.workspace = true
ramflux-desktop-core.workspace = true
# The real source over the daemon (its tokio runtime stays on the bridge thread).
ramflux-desktop-sdk.workspace = true
# The scenario-playing mock source drives the UI until the SDK source lands (F2).
ramflux-desktop-test.workspace = true
rust-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true
# Local wall-clock time for moment headers (already in the dependency graph).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
ramflux-desktop-test = { workspace = true, features = ["fake-bus", "live-daemon"] }
# The node key fingerprint and base64 of the demo rehearsal (already in the graph).
ramflux-protocol.workspace = true

# Offscreen reference screenshots; run explicitly, not part of `cargo test`.
[[test]]
name = "screenshots"
path = "tests/screenshots.rs"
test = false
harness = false

# Offscreen screenshot of the window on a live daemon; run explicitly with
# RAMFLUX_SHOTS_SOCKET set, not part of `cargo test`.
[[test]]
name = "live_screenshot"
path = "tests/live_screenshot.rs"
test = false
harness = false

# Offscreen screenshots of the first-run states (optionally on a real daemon
# started from the app); run explicitly, not part of `cargo test`.
[[test]]
name = "first_run_shots"
path = "tests/first_run_shots.rs"
test = false
harness = false

# The tier-2 demo rehearsed against a real node; run explicitly with
# RAMFLUX_DEMO_REHEARSAL=1 and the node's URL and key, never in CI.
[[test]]
name = "demo_rehearsal"
path = "tests/demo_rehearsal.rs"
test = false
harness = false

[[test]]
name = "conversation_shots"
path = "tests/conversation_shots.rs"
test = false
harness = false
