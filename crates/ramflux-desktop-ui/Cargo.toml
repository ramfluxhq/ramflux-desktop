[package]
name = "ramflux-desktop-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
gpui-kit.workspace = true
ramflux-desktop-core.workspace = true
# The real source over the daemon (its tokio runtime stays on the bridge thread).
ramflux-desktop-sdk.workspace = true
# The voice call media engine and the audio devices (its own threads).
ramflux-desktop-media.workspace = true
# The scenario-playing mock source drives the UI until the SDK source lands (F2).
ramflux-desktop-test.workspace = true
rust-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true
# Local wall-clock time for moment headers (already in the dependency graph).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# QR code of the user's own contact card (MIT, no dependencies).
qrcodegen = "1.8"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
ramflux-desktop-test = { workspace = true, features = ["fake-bus", "live-daemon"] }
# The node key fingerprint and base64 of the demo rehearsal (already in the graph).
ramflux-protocol.workspace = true
# The principal commitment of the demo ③ rehearsal's accounts (already in the graph).
ramflux-sdk.workspace = true

# Offscreen reference screenshots; run explicitly, not part of `cargo test`.
[[test]]
name = "screenshots"
path = "tests/screenshots.rs"
test = false
harness = false

# Has its own main: the test binary is also the stand-in daemon it starts.
[[test]]
name = "first_run"
path = "tests/first_run.rs"
harness = false

# Offscreen screenshot of the window on a live daemon; run explicitly with
# RAMFLUX_SHOTS_SOCKET set, not part of `cargo test`.
[[test]]
name = "live_screenshot"
path = "tests/live_screenshot.rs"
test = false
harness = false

# Offscreen screenshots of the first-run states (optionally on a real daemon
# started from the app); run explicitly, not part of `cargo test`.
[[test]]
name = "first_run_shots"
path = "tests/first_run_shots.rs"
test = false
harness = false

# The tier-2 demo rehearsed against a real node; run explicitly with
# RAMFLUX_DEMO_REHEARSAL=1 and the node's URL and key, never in CI.
[[test]]
name = "demo_rehearsal"
path = "tests/demo_rehearsal.rs"
test = false
harness = false

[[test]]
name = "conversation_shots"
path = "tests/conversation_shots.rs"
test = false
harness = false

# Offscreen screenshots of adding contacts, the contact card and a new
# group; run explicitly, not part of `cargo test`.
[[test]]
name = "contacts_shots"
path = "tests/contacts_shots.rs"
test = false
harness = false

[[test]]
name = "sync_shots"
path = "tests/sync_shots.rs"
test = false
harness = false


# Offscreen screenshots of agent surfaces from a (fake) daemon; run explicitly.
[[test]]
name = "surface_shots"
path = "tests/surface_shots.rs"
test = false
harness = false

# Offscreen screenshots of the conversation view for a design review, at two
# window sizes, both languages and both themes; run explicitly.
[[test]]
name = "polish_shots"
path = "tests/polish_shots.rs"
test = false
harness = false

# Offscreen screenshots of tasks on the SDK source (a fake daemon); run
# explicitly, not part of `cargo test`.
[[test]]
name = "task_shots"
path = "tests/task_shots.rs"
test = false
harness = false

# Demo ③ (tasks with human approval) rehearsed against a real node; run
# explicitly with RAMFLUX_DEMO_REHEARSAL=1 and the node's URL and key.
[[test]]
name = "task_rehearsal"
path = "tests/task_rehearsal.rs"
test = false
harness = false

# Voice calls rehearsed against a real node with the voice relay; run
# explicitly with RAMFLUX_DEMO_REHEARSAL=1 and the node's URL and key.
[[test]]
name = "call_rehearsal"
path = "tests/call_rehearsal.rs"
test = false
harness = false

# Offscreen screenshots of contact requests in the contacts dock; run
# explicitly, not part of `cargo test`.
[[test]]
name = "request_shots"
path = "tests/request_shots.rs"
test = false
harness = false

[[test]]
name = "peer_kind_shots"
path = "tests/peer_kind_shots.rs"
test = false
harness = false

# Offscreen screenshots of voice calls (button, card, bar, records); run
# explicitly, not part of `cargo test`.
[[test]]
name = "call_shots"
path = "tests/call_shots.rs"
test = false
harness = false

# Offscreen screenshots of Settings · Backup (backup, restore, review,
# results, failures); run explicitly, not part of `cargo test`.
[[test]]
name = "backup_shots"
path = "tests/backup_shots.rs"
test = false
harness = false
