name: Linux release build

# Builds the Linux release archives for x86_64 and aarch64 from a version
# tag (or on demand), checks the desktop integration files, and uploads the
# archives with SHA256SUMS as workflow artefacts. It never creates a
# release, a tag or a package: publishing stays a deliberate, manual step.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    # Ubuntu 24.04 carries desktop-file-utils 0.27 and AppStream 1.0, which
    # know every key the files use.
    name: desktop entry and AppStream metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Validators
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y desktop-file-utils appstream

      - name: Validate
        env:
          REQUIRE_VALIDATORS: "1"
        run: scripts/validate-linux-metadata.sh

  build:
    # Ubuntu 22.04 (glibc 2.35) keeps the archives runnable on older
    # distributions; Arch and Omarchy are far newer.
    name: build linux-${{ matrix.arch }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
          # The archive's file times come from the tagged commit.
          fetch-depth: 1

      - name: System libraries
        timeout-minutes: 20
        run: bash .github/scripts/install-system-libraries.sh

      - name: Rust toolchain (from rust-toolchain.toml)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install

      - name: Fetch dependencies
        timeout-minutes: 10
        env:
          CARGO_NET_RETRY: "3"
          CARGO_HTTP_TIMEOUT: "30"
        run: cargo fetch --locked

      - name: Build and package
        env:
          CARGO_NET_OFFLINE: "true"
        run: scripts/package-linux.sh --out "$RUNNER_TEMP/dist"

      - name: Linked libraries (for the package dependencies)
        run: |
          bin=$(mktemp -d)
          tar -xzf "$RUNNER_TEMP"/dist/ramflux-desktop-*-linux-${{ matrix.arch }}.tar.gz -C "$bin"
          ldd "$bin"/*/usr/bin/ramflux-desktop | tee "$RUNNER_TEMP/dist/ldd-linux-${{ matrix.arch }}.txt"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/dist/ramflux-desktop-*.tar.gz
            ${{ runner.temp }}/dist/ldd-linux-*.txt
          if-no-files-found: error

  checksums:
    name: SHA256SUMS and provenance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Keyless build provenance through GitHub's Sigstore integration: no
      # secret and no paid service (attestations are free on public
      # repositories). Only tag builds are attested.
      id-token: write
      attestations: write
    steps:
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum ramflux-desktop-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/ramflux-desktop-*.tar.gz

      # A detached signature over SHA256SUMS for distribution recipes that
      # verify with offline keys (PGP or minisign) waits for the owner's
      # release-key decision (docs/linux.md, "Signatures"); nothing signs
      # here until then.

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release
          path: |
            dist/ramflux-desktop-*.tar.gz
            dist/SHA256SUMS
            dist/ldd-linux-*.txt
          if-no-files-found: error
