name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# One group per ref: a newer push to a feature branch cancels the older run.
# Main runs get a per-commit group so they are never cancelled or superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: fmt, clippy (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: File size limit
        run: |
          over=$(git ls-files '*.rs' '*.toml' '*.yml' '*.yaml' | while IFS= read -r f; do
            n=$(wc -l < "$f")
            if [ "$n" -gt 5000 ]; then echo "$n $f"; fi
          done)
          if [ -n "$over" ]; then
            echo "Files over 5000 lines (split by responsibility):"
            echo "$over"
            exit 1
          fi
          echo "OK: no tracked .rs/.toml/.yml file over 5000 lines"

      - name: Prepare APT package cache
        id: apt-cache
        run: |
          sudo mkdir -p /var/cache/apt/archives
          sudo chown "$USER:$(id -gn)" /var/cache/apt/archives
          echo "image_os=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "image_version=$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "iso_week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: APT package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-${{ runner.os }}-${{ steps.apt-cache.outputs.image_os }}-${{ steps.apt-cache.outputs.image_version }}-${{ hashFiles('.github/apt-packages.txt') }}-${{ steps.apt-cache.outputs.iso_week }}
          restore-keys: |
            apt-${{ runner.os }}-${{ steps.apt-cache.outputs.image_os }}-${{ steps.apt-cache.outputs.image_version }}-${{ hashFiles('.github/apt-packages.txt') }}-

      - name: System libraries
        timeout-minutes: 20
        run: bash .github/scripts/install-system-libraries.sh

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        timeout-minutes: 5
        continue-on-error: true

      - name: Fetch dependencies
        timeout-minutes: 5
        env:
          CARGO_NET_RETRY: "3"
          CARGO_HTTP_TIMEOUT: "30"
        run: cargo fetch --locked

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The screenshot programs are `test = false` targets, which
      # `--all-targets` skips; lint them explicitly so they cannot rot.
      - name: Clippy (screenshot programs)
        timeout-minutes: 10
        env:
          CARGO_NET_OFFLINE: "true"
        run: scripts/check-shot-programs.sh

  test:
    # The workspace suite is repeated three times on separate runners to catch
    # flaky tests; any failing repeat fails the workflow.
    name: test linux (repeat ${{ matrix.repeat }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        repeat: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Prepare APT package cache
        id: apt-cache
        run: |
          sudo mkdir -p /var/cache/apt/archives
          sudo chown "$USER:$(id -gn)" /var/cache/apt/archives
          echo "image_os=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "image_version=$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "iso_week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: APT package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-${{ runner.os }}-${{ steps.apt-cache.outputs.image_os }}-${{ steps.apt-cache.outputs.image_version }}-${{ hashFiles('.github/apt-packages.txt') }}-${{ steps.apt-cache.outputs.iso_week }}
          restore-keys: |
            apt-${{ runner.os }}-${{ steps.apt-cache.outputs.image_os }}-${{ steps.apt-cache.outputs.image_version }}-${{ hashFiles('.github/apt-packages.txt') }}-

      - name: System libraries
        timeout-minutes: 20
        run: bash .github/scripts/install-system-libraries.sh

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        timeout-minutes: 5
        continue-on-error: true
        with:
          # One cache for all repeats; only repeat 1 writes it.
          shared-key: linux-test
          save-if: ${{ matrix.repeat == 1 }}

      - name: Fetch dependencies
        timeout-minutes: 5
        env:
          CARGO_NET_RETRY: "3"
          CARGO_HTTP_TIMEOUT: "30"
        run: cargo fetch --locked

      - name: Test
        timeout-minutes: 25
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --workspace --no-fail-fast

  macos:
    # GPUI tests use the headless test platform and the media tests use
    # synthetic audio, so no display or audio device is needed. Runs on main,
    # ci/* branches and on demand only, to keep macOS minutes low.
    name: fmt, clippy, test (macos)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ci/')
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          persist-credentials: false

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        timeout-minutes: 5
        continue-on-error: true

      - name: Fetch dependencies
        timeout-minutes: 5
        env:
          CARGO_NET_RETRY: "3"
          CARGO_HTTP_TIMEOUT: "30"
        run: cargo fetch --locked

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The screenshot programs are `test = false` targets, which
      # `--all-targets` skips; lint them explicitly so they cannot rot.
      - name: Clippy (screenshot programs)
        timeout-minutes: 10
        env:
          CARGO_NET_OFFLINE: "true"
        run: scripts/check-shot-programs.sh

      - name: Test
        timeout-minutes: 25
        # Hosted macOS runners give no real-time scheduling guarantees, so the
        # real-time media loopback test (two_engines_talk_through_a_relay)
        # misses its jitter deadlines there. It stays blocking in the Linux x3
        # job and locally; only this hosted job skips it (CALL-FU-01). Every
        # other macOS test stays blocking. The skip is unconditional because
        # this job only ever runs on a hosted macOS runner. The skip is scoped to the media crate: custom-harness test targets in
        # other crates do not understand libtest's --skip/--exact.
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          rc=0
          cargo test --workspace --exclude ramflux-desktop-media --no-fail-fast || rc=1
          cargo test -p ramflux-desktop-media --no-fail-fast -- \
            --skip two_engines_talk_through_a_relay --exact || rc=1
          exit "$rc"
