name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# One group per ref: a newer push to a feature branch cancels the older run.
# Main runs get a per-commit group so they are never cancelled or superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22

      - name: File size limit
        run: |
          over=$(git ls-files '*.rs' '*.toml' '*.yml' '*.yaml' | while IFS= read -r f; do
            n=$(wc -l < "$f")
            if [ "$n" -gt 5000 ]; then echo "$n $f"; fi
          done)
          if [ -n "$over" ]; then
            echo "Files over 5000 lines (split by responsibility):"
            echo "$over"
            exit 1
          fi
          echo "OK: no tracked .rs/.toml/.yml file over 5000 lines"

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libvulkan1 libasound2-dev cmake

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace
