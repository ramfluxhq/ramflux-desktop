name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# One group per ref: a newer push to a feature branch cancels the older run.
# Main runs get a per-commit group so they are never cancelled or superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: fmt, clippy (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22

      - name: File size limit
        run: |
          over=$(git ls-files '*.rs' '*.toml' '*.yml' '*.yaml' | while IFS= read -r f; do
            n=$(wc -l < "$f")
            if [ "$n" -gt 5000 ]; then echo "$n $f"; fi
          done)
          if [ -n "$over" ]; then
            echo "Files over 5000 lines (split by responsibility):"
            echo "$over"
            exit 1
          fi
          echo "OK: no tracked .rs/.toml/.yml file over 5000 lines"

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libvulkan1 libasound2-dev cmake fonts-noto-cjk

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    # The workspace suite is repeated three times on separate runners to catch
    # flaky tests; any failing repeat fails the workflow.
    name: test linux (repeat ${{ matrix.repeat }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        repeat: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libvulkan1 libasound2-dev cmake fonts-noto-cjk

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb
        with:
          # One cache for all repeats; only the first finisher saves it.
          shared-key: linux-test

      - name: Test
        run: cargo test --workspace --no-fail-fast

  macos:
    # GPUI tests use the headless test platform and the media tests use
    # synthetic audio, so no display or audio device is needed. Runs on main,
    # ci/* branches and on demand only, to keep macOS minutes low.
    name: fmt, clippy, test (macos)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ci/')
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22

      - name: Cache
        uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        # Hosted macOS runners give no real-time scheduling guarantees, so the
        # real-time media loopback test (two_engines_talk_through_a_relay)
        # misses its jitter deadlines there. It stays blocking in the Linux x3
        # job and locally; only this hosted job skips it (CALL-FU-01). Every
        # other macOS test stays blocking.
        env:
          RAMFLUX_CI_HOSTED_MACOS: "1"
        # The skip is scoped to the media crate: custom-harness test targets in
        # other crates do not understand libtest's --skip/--exact.
        run: |
          if [ "$RAMFLUX_CI_HOSTED_MACOS" != "1" ]; then
            exec cargo test --workspace --no-fail-fast
          fi
          rc=0
          cargo test --workspace --exclude ramflux-desktop-media --no-fail-fast || rc=1
          cargo test -p ramflux-desktop-media --no-fail-fast -- \
            --skip two_engines_talk_through_a_relay --exact || rc=1
          exit "$rc"
